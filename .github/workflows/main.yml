name: Playwright Tests
on:
  workflow_dispatch:
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]

  # schedule:
  #  - cron: '44 7 * * *'  # Runs every day at 10 PM IST (16:30 UTC)
  # - cron: '0 12 * * 1'  # Runs every Monday at 5:30 PM IST (12:00 UTC)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:latest # Official Playwright Docker image
    steps:
      - uses: actions/checkout@v4
      
        
      - name: Install dependencies inside the container
        run:
          npm ci
          # - name: Install Playwright Browsers
      # -  run: npx playwright install --with-deps
      - name: Run the below Playwright test
        run: npx playwright test MyTests/login.spec.ts --workers=1

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
